[program:bt-panel]
command=/www/server/panel/pyenv/bin/python3 /www/server/panel/BT-Panel
directory=/www/server/panel
autostart=true
autorestart=true
startretries=3
startsecs=3
stdout_logfile=/workspace/logs/bt-panel.stdout.log
stderr_logfile=/workspace/logs/bt-panel.stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile_backups=2
environment=PYTHONPATH="/www/server/panel"

[program:bt-proxy3]
command=python3 /workspace/bt-proxy3.py
autostart=true
autorestart=true
startretries=3
startsecs=2
stdout_logfile=/workspace/logs/bt-proxy3.stdout.log
stderr_logfile=/workspace/logs/bt-proxy3.stderr.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

[program:cf-edge-proxy]
command=python3 /workspace/cf-edge-proxy.py
autostart=true
autorestart=true
startretries=3
startsecs=2
stdout_logfile=/workspace/logs/cf-edge-proxy.stdout.log
stderr_logfile=/workspace/logs/cf-edge-proxy.stderr.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

[program:cloudflared]
; Token read from file at runtime — NEVER hardcode the tunnel token here
command=bash -c 'TOKEN=$(cat /workspace/cf-tunnel-token.txt 2>/dev/null) && exec /workspace/cloudflared tunnel --no-autoupdate --no-prechecks --protocol http2 --metrics 127.0.0.1:20241 run --token "$TOKEN"'
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/workspace/logs/cloudflared.stdout.log
stderr_logfile=/workspace/logs/cloudflared.stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=TUNNEL_EDGE="127.0.0.1:7844"

[program:sandbox-watchdog]
command=bash /workspace/sandbox-watchdog.sh _daemon
autostart=true
autorestart=true
startretries=3
startsecs=2
stdout_logfile=/workspace/logs/watchdog.stdout.log
stderr_logfile=/workspace/logs/watchdog.stderr.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
